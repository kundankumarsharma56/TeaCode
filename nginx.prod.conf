# Serves the SPA and proxies /api to the backend so the browser sees a single origin
# (first-party cookies, no CORS). TLS is terminated in front of this container.
upstream backend {
    server backend:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Scheme as seen by the browser: trust the outer TLS-terminating proxy's header when present.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Defence in depth in front of the backend's own per-user limits (those remain authoritative).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Real client address. Only X-Forwarded-For set by a private-network peer (the outer load balancer) is believed;
    # anything a direct client sends is ignored. Adjust set_real_ip_from to your load balancer's address range.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok";
    }

    # Authentication endpoints: coarse per-address throttle on top of the backend's per-IP/per-account limits.
    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-common.conf;
        client_max_body_size 16k;
    }

    # Avatar upload: larger body than the default API limit (the backend validates and re-encodes).
    location = /api/v1/users/me/avatar {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-common.conf;
        client_max_body_size 3m;
    }

    # Everything else under /api inherits the server-level security headers (no add_header here on purpose).
    location /api/ {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-common.conf;
        client_max_body_size 256k;
    }

    # Bidirectional terminal stream. Session ids are unguessable and credentials are sent
    # in the first WebSocket frame, not in the URL (so they are not written to access logs).
    location /terminal-ws/ { return 404; }

    # Spring Security OAuth2 client: initiation and provider callbacks.
    location ~ ^/(oauth2/authorization|login/oauth2/code)/ {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Actuator and API docs are not exposed publicly through the proxy.
    location /actuator/ { return 404; }
    location /swagger-ui/ { return 404; }
    location /v3/api-docs { return 404; }

    location /assets/ {
        # Hashed build assets never change: one explicit Cache-Control header (no `expires`, which would add a second one).
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
