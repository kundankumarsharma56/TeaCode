services:
  mysql:
    ports: !reset []
  terminal-docker:
    profiles: !override ["terminal"]
  terminal-runner:
    profiles: !override ["terminal"]
  frontend:
    ports: !reset []
    depends_on: !override
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
  caddy:
    image: caddy:2
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      - terminal-app
    depends_on:
      frontend:
        condition: service_healthy
volumes:
  caddy-data: