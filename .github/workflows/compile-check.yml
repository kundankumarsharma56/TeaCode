name: Compile check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -DskipTests test-compile

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TeaCode-fontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TeaCode-fontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
