name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TeaCode-fontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TeaCode-fontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fails the build on any known high/critical advisory in production dependencies.
      - run: npm audit --omit=dev --audit-level=high

  terminal-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terminal-runner/package-lock.json
      - run: npm ci
      - run: npm run check
      # Protocol tests against a scripted fake Docker daemon (they do not prove container isolation).
      - run: npm test

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Executes every reference solution (Python and C++) on every public and hidden test, cross-checks the outputs,
      # and fails on any invalid, duplicate or under-specified problem. (--check writes nothing: the committed V9
      # migration embeds the toolchain versions it was generated with, so it is regenerated deliberately, not in CI.)
      - run: python3 catalog/build.py --check

  backend:
    runs-on: ubuntu-latest   # Docker is available, which the Testcontainers integration tests need
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compile, unit tests and integration tests (real MySQL via Testcontainers)
        run: mvn -B verify

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan lockfiles and pom.xml for known vulnerabilities (HIGH and CRITICAL fail the build)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

  images:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-only-0123456789abcdefghijklmnopqrstuvwxyz/' .env
          docker compose --profile full config -q
      - name: Build both images
        run: docker compose --profile full build
