spring:
  application:
    name: teacode
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway is the only schema authority
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      # A session exists only for the few seconds of an OAuth2 sign-in handshake (state/PKCE) and is
      # invalidated afterwards. Normal API calls are stateless (JWT cookies).
      timeout: 10m
      cookie:
        name: CV_OAUTH
        http-only: true
        same-site: lax
        secure: true   # overridden to false by the dev profile

spring.servlet.multipart:
  max-file-size: 2MB
  max-request-size: 3MB

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never


teacode:
  public-url: ${APP_PUBLIC_URL}
  mail-from: ${MAIL_FROM:}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:codevibs}
    access-ttl-minutes: 15
    refresh-ttl-days: 14
    cookie-secure: true
  jdoodle:
    client-id: ${JDOODLE_CLIENT_ID:}
    client-secret: ${JDOODLE_CLIENT_SECRET:}
    base-url: https://api.jdoodle.com
    read-timeout-seconds: 30
    max-concurrent-calls: 2          # bounded: every call spends one JDoodle credit
    max-tests-per-submission: 20
    job-deadline-seconds: 180
    disabled-languages: ${JDOODLE_DISABLED_LANGUAGES:}
  imports:
    max-archive-bytes: 20971520
    folder: ${PROBLEM_PACKAGES_DIR:}   # empty = package import disabled
    auto-publish: ${PROBLEM_PACKAGES_AUTO_PUBLISH:true}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
