# Forwarding rules shared by every proxied location.
# The client address is the one nginx resolved (see real_ip_* in default.conf), written as a single value so a
# client-supplied X-Forwarded-For chain can never reach the backend (rate limits and audit hashes key on it).
proxy_http_version 1.1;
# $http_host keeps the port the browser used (e.g. localhost:8081); $host drops it. Spring decides whether a POST is
# cross-origin by comparing its Origin header with this host and port, so dropping the port made every same-origin
# POST (login, register, terminal) look cross-origin and be refused with 403 unless it matched APP_PUBLIC_URL exactly.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port "";
proxy_set_header Forwarded "";
proxy_set_header X-Correlation-Id $http_x_correlation_id;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
